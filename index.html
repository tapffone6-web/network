<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONEY VAULT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #131B2E;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .page-section {
            padding: 15px;
            display: none;
        }
        .page-section.active {
            display: block;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .card {
            background: #1b263b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #23304a;
        }
        .section-desc {
            color: #94a3b8;
            font-size: 13px;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0b101b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #23304a;
            z-index: 1000;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
        }
        .nav-btn i {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }
        .nav-btn.active {
            color: #0098EA;
        }
        .action-btn {
            background: #0098EA;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .stats-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-box {
            flex: 1;
            background: #1b263b;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #23304a;
        }
        .claim-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- 1. الصفحة الرئيسية (Home) كما كانت تماماً -->
    <div id="sec-home" class="page-section active">
        <div style="text-align: right; font-size: 22px; font-weight: bold; margin: 10px 15px 20px 0;">Moon Network</div>
        
        <div class="card">
            <div style="font-size: 13px; color: #94a3b8; text-align: right;">رصيدك الحالي</div>
            <div id="balance" style="font-size: 32px; font-weight: bold; margin: 5px 0 15px 0; color: #38bdf8; text-align: right;">0.037</div>
            <button class="action-btn" style="background: #0098EA; display: flex; justify-content: center; align-items: center; gap: 8px;">
                <span>إيداع USDT</span> <i class="fas fa-wallet"></i>
            </button>
        </div>

        <button class="action-btn" style="margin-bottom: 15px; background: #0098EA; font-size: 15px;">
            مشاهدة إعلان للحصول على مكافأة 🎬
        </button>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="section-desc" style="font-size: 12px;">ترتيبك في الشبكة</div>
                <div style="font-size: 20px; font-weight: bold; color: #38bdf8; margin-top: 5px;">--#</div>
            </div>
            <div class="stat-box">
                <div class="section-desc" style="font-size: 12px;">إعلانات شاهدتها</div>
                <div style="font-size: 20px; font-weight: bold; color: #38bdf8; margin-top: 5px;">1</div>
            </div>
        </div>

        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div style="font-weight: bold; font-size: 16px;">🎁 المكافأة اليومية</div>
                <div class="section-desc" style="margin-top: 5px;">لقد أخذت مكافأتك اليوم, عد غداً.</div>
            </div>
            <div>
                <button class="claim-btn">تم المطالبة</button>
            </div>
        </div>
    </div>

    <!-- 2. صفحة الاستثمار (Invest) -->
    <div id="sec-invest" class="page-section" style="display:none;">
        <div class="section-title">قسم الاستثمار</div>
        <div class="card">
            <div style="font-weight: bold;">الباقة الأولى</div>
            <p class="section-desc">ربح يومي 0.6 USDT</p>
            <button class="action-btn">استثمار الآن</button>
        </div>
    </div>

    <!-- 3. صفحة المهام (Tasks) -->
    <div id="sec-tasks" class="page-section" style="display:none;">
        <div class="section-title">المهام اليومية</div>
        <div class="card">
            <p class="section-desc">شاهد الإعلانات واكسب الأرباح</p>
            <button class="action-btn">بدء المهمة</button>
        </div>
    </div>

    <!-- 4. صفحة الإحالات (Referrals) -->
    <div id="sec-referrals" class="page-section" style="display:none;">
        <div class="section-title">برنامج الإحالات</div>
        <div class="card">
            <p class="section-desc">شارك رابطك الخاص واربح عمولة عن كل صديق ينضم.</p>
            <button class="action-btn">نسخ الرابط</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي الأصلي -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="showPage('home', this)">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-btn" onclick="showPage('invest', this)">
            <i class="fas fa-chart-line"></i>
            <span>Invest</span>
        </button>
        <button class="nav-btn" onclick="showPage('tasks', this)">
            <i class="fas fa-list-check"></i>
            <span>Tasks</span>
        </button>
        <button class="nav-btn" onclick="showPage('referrals', this)">
            <i class="fas fa-users"></i>
            <span>Referrals</span>
        </button>
    </div>

    <script>
        function showPage(pageId, btn) {
            document.querySelectorAll('.page-section').forEach(sec => {
                sec.style.display = 'none';
                sec.classList.remove('active');
            });
            
            const targetSec = document.getElementById('sec-' + pageId);
            if (targetSec) {
                targetSec.style.display = 'block';
                targetSec.classList.add('active');
            }
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) {
                btn.classList.add('active');
            }
        }
    </script>
</body>
</html>
