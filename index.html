<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Network</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #080b11; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 15px 15px 80px 15px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card {
            background: linear-gradient(145deg, #131b2e, #0f172a);
            border-radius: 20px; padding: 20px; margin-top: 15px;
            border: 1px solid #1e293b; box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .balance-title { color: #94a3b8; font-size: 14px; }
        .balance { font-size: 34px; font-weight: bold; margin: 5px 0; color: #38bdf8; }
        
        /* إخفاء وإظهار الأقسام */
        .section { display: none; }
        .section.active { display: block; }

        /* شريط التنقل السفلي */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: #0f172a; display: flex; justify-content: space-around;
            padding: 12px 0; border-top: 1px solid #1e293b; z-index: 100;
        }
        .nav-item { text-align: center; color: #94a3b8; font-size: 12px; text-decoration: none; cursor: pointer; background: none; border: none; }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 4px; }
        .nav-item.active { color: #38bdf8; }
        
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #f8fafc; }
        .section-desc { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <!-- قسم الصفحة الرئيسية (Home) -->
    <div id="home-section" class="section active">
        <div class="header">
            <h2>Moon Network</h2>
        </div>

        <div class="card">
            <div class="balance-title">رصيدك الحالي</div>
            <div class="balance" id="balance">0.001</div>
        </div>

        <!-- زر الإعلان الفعّال -->
        <button id="watchAdBtn" style="width: 100%; padding: 16px; background-color: #0088cc; color: #ffffff; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; box-shadow: 0 4px 12px rgba(0,136,204,0.3);">
          🎬 مشاهدة إعلان للحصول على مكافأة
        </button>
    </div>

    <!-- قسم الاستثمار (Invest) -->
    <div id="invest-section" class="section">
        <div class="section-title">قسم الاستثمار</div>
        <div class="card">
            <p class="section-desc">استثمر أموالك واحصل على أرباح يومية تصاعدية مع شبكة Moon.</p>
            <button style="width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; border-radius: 10px; font-weight: bold; margin-top: 10px;">بدء الاستثمار</button>
        </div>
    </div>

    <!-- قسم المهام (Tasks) -->
    <div id="tasks-section" class="section">
        <div class="section-title">المهام اليومية</div>
        <div class="card">
            <p class="section-desc">أتمم المهام التالية لزيادة أرباحك من الـ USDT.</p>
            <div style="background: #080b11; padding: 12px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span>انضم لقناة التليجرام (+0.005)</span>
                <button style="background: #38bdf8; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; color: #080b11;">تنفيذ</button>
            </div>
        </div>
    </div>

    <!-- قسم الإحالات (Referrals) -->
    <div id="referrals-section" class="section">
        <div class="section-title">برنامج الإحالات</div>
        <div class="card">
            <p class="section-desc">ادع أصدقائك واحصُد نسبة من أرباحهم مباشرة.</p>
            <button style="width: 100%; padding: 12px; background-color: #8b5cf6; color: white; border: none; border-radius: 10px; font-weight: bold; margin-top: 10px;" onclick="alert('تم نسخ رابط الإحالة بنجاح!')">نسخ رابط الإحالة</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar">
        <button class="nav-item" onclick="switchTab('referrals', this)"><i class="fa-solid fa-users"></i>Referrals</button>
        <button class="nav-item" onclick="switchTab('tasks', this)"><i class="fa-solid fa-list-check"></i>Tasks</button>
        <button class="nav-item" onclick="switchTab('invest', this)"><i class="fa-solid fa-chart-line"></i>Invest</button>
        <button class="nav-item active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i>Home</button>
    </div>

    <script>
        let userBalance = 0.001;

        // دالة التنقل بين الأقسام
        function switchTab(tabName, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabName + '-section').classList.add('active');
            element.classList.add('active');
        }

        // تشغيل إعلانات Adsgram
        const AdController = window.Adsgram.init({ 
            blockId: "46739" 
        });

        const adButton = document.getElementById('watchAdBtn');

        adButton.addEventListener('click', () => {
            AdController.show().then((result) => {
                userBalance += 0.001; 
                document.getElementById('balance').innerText = userBalance.toFixed(3);
                alert("تهانينا! تمت إضافة +0.001 USDT لربحك.");
            }).catch((result) => {
                alert("لم يتم اكتمال مشاهدة الإعلان.");
            });
        });
    </script>
</body>
</html>
