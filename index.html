<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONEY VAULT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #131B2E;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        .page-section {
            padding: 15px;
            display: none;
        }
        .page-section.active {
            display: block;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .card {
            background: #1b263b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #23304a;
        }
        .section-desc {
            color: #94a3b8;
            font-size: 13px;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0b101b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #23304a;
            z-index: 1000;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
        }
        .nav-btn i {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }
        .nav-btn.active {
            color: #0098EA;
        }
        .action-btn {
            background: #0098EA;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 1. الصفحة الرئيسية (Home) -->
    <div id="sec-home" class="page-section active">
        <div class="section-title">الرئيسية</div>
        <div class="card">
            <div style="font-size: 14px; color: #94a3b8;">الرصيد الحالي</div>
            <div id="balance" style="font-size: 24px; font-weight: bold; margin-top: 5px;">0.00 USDT</div>
        </div>
        <div class="card">
            <div style="font-weight: bold; margin-bottom: 10px;">إيداع USDT</div>
            <div style="margin-top: 10px;">
                <label class="section-desc">المبلغ:</label>
                <input type="number" id="depositAmount" placeholder="0.00" style="width: 100%; padding: 10px; background: #0b101b; border: 1px solid #23304a; color: white; border-radius: 8px; margin-top: 5px;">
            </div>
            <button class="action-btn" onclick="alert('تم إرسال طلب الإيداع')">تأكيد الإيداع</button>
        </div>
    </div>

    <!-- 2. صفحة الاستثمار (Invest) -->
    <div id="sec-invest" class="page-section" style="display:none;">
        <div class="section-title">قسم الاستثمار</div>
        <div class="card">
            <div style="font-weight: bold;">الباقة الأولى</div>
            <p class="section-desc">ربح يومي 0.6 USDT</p>
            <button class="action-btn">استثمار الآن</button>
        </div>
    </div>

    <!-- 3. صفحة السحب (Withdraw) -->
    <div id="sec-withdraw" class="page-section" style="display:none;">
        <div class="section-title">سحب الأرباح</div>
        <div class="card">
            <div style="font-weight: bold; margin-bottom: 8px;">سحب رصيد USDT</div>
            <p class="section-desc">أدخل تفاصيل محفظتك للسحب</p>
            
            <div style="margin-top: 15px;">
                <label style="font-size: 13px; display: block; margin-bottom: 5px;">المبلغ:</label>
                <input type="number" id="withdrawAmount" placeholder="0.00" style="width: 100%; padding: 12px; background: #0b101b; border: 1px solid #23304a; color: white; border-radius: 10px;">
            </div>

            <div style="margin-top: 15px;">
                <label style="font-size: 13px; display: block; margin-bottom: 5px;">عنوان محفظة TRC20:</label>
                <input type="text" id="withdrawAddress" placeholder="T..." style="width: 100%; padding: 12px; background: #0b101b; border: 1px solid #23304a; color: white; border-radius: 10px;">
            </div>

            <button class="action-btn" onclick="alert('تم إرسال طلب السحب بنجاح')">تأكيد السحب</button>
        </div>
    </div>

    <!-- 4. صفحة المهام (Tasks) -->
    <div id="sec-tasks" class="page-section" style="display:none;">
        <div class="section-title">المهام اليومية</div>
        <div class="card">
            <p class="section-desc">شاهد الإعلانات واكسب الأرباح</p>
            <button class="action-btn">بدء المهمة</button>
        </div>
    </div>

    <!-- 5. صفحة الإحالات (Referrals) -->
    <div id="sec-referrals" class="page-section" style="display:none;">
        <div class="section-title">برنامج الإحالات</div>
        <div class="card">
            <p class="section-desc">شارك رابطك الخاص واربح عمولة عن كل صديق ينضم.</p>
            <button class="action-btn">نسخ الرابط</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي (Navigation Bar) -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="showPage('home', this)">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-btn" onclick="showPage('invest', this)">
            <i class="fas fa-chart-line"></i>
            <span>Invest</span>
        </button>
        <button class="nav-btn" onclick="showPage('tasks', this)">
            <i class="fas fa-list-check"></i>
            <span>Tasks</span>
        </button>
        <button class="nav-btn" onclick="showPage('referrals', this)">
            <i class="fas fa-users"></i>
            <span>Referrals</span>
        </button>
        <button class="nav-btn" onclick="showPage('withdraw', this)">
            <i class="fas fa-wallet"></i>
            <span>سحب</span>
        </button>
    </div>

    <script>
        function showPage(pageId, btn) {
            // إخفاء جميع الأقسام وإزالة التفعيل
            document.querySelectorAll('.page-section').forEach(sec => {
                sec.style.display = 'none';
                sec.classList.remove('active');
            });
            
            // إظهار القسم المستهدف وتفعيله
            const targetSec = document.getElementById('sec-' + pageId);
            if (targetSec) {
                targetSec.style.display = 'block';
                targetSec.classList.add('active');
            }
            
            // تحديث الأزرار في شريط التنقل
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) {
                btn.classList.add('active');
            }
        }
    </script>
</body>
</html>
