<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Network</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #080b11; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 15px 15px 80px 15px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .card {
            background: linear-gradient(145deg, #131b2e, #0f172a);
            border-radius: 20px; padding: 20px; margin-top: 15px;
            border: 1px solid #1e293b; box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .balance-title { color: #94a3b8; font-size: 14px; }
        .balance { font-size: 34px; font-weight: bold; margin: 5px 0; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Moon Network</h2>
    </div>

    <div class="card">
        <div class="balance-title">رصيدك الحالي</div>
        <div class="balance" id="balance">0.000</div>
    </div>

    <!-- زر مشاهدة الإعلان -->
    <button id="watchAdBtn" style="width: 100%; padding: 14px; background-color: #0088cc; color: #ffffff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px;">
      🎬 مشاهدة إعلان للحصول على مكافأة
    </button>

    <script>
        let userBalance = 0.000;

        // تهيئة إعلانات Adsgram بالمعرف الخاص بك
        const AdController = window.Adsgram.init({ 
            blockId: "46739" 
        });

        const adButton = document.getElementById('watchAdBtn');

        adButton.addEventListener('click', () => {
            // استدعاء عرض الإعلان الحقيقي
            AdController.show().then((result) => {
                // إذا أكمل المستخدم مشاهدة الإعلان بنجاح
                userBalance += 0.001; 
                document.getElementById('balance').innerText = userBalance.toFixed(3);
                alert("تهانينا! تمت إضافة +0.001 USDT لربحك.");
            }).catch((result) => {
                // إذا قام المستخدم بإغلاق الإعلان قبل نهايته
                alert("لم يتم اكتمال مشاهدة الإعلان.");
            });
        });
    </script>
</body>
</html>
